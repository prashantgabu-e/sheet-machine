<!doctype html><html><head><base target="_top"></head><body><script>
  // This document is intentionally tiny: it is a trusted postMessage bridge, not the UI.
  const PARENT_ORIGIN = '<?!= parentOrigin ?>';
  const send = (message) => window.parent.postMessage(message, PARENT_ORIGIN);
  window.addEventListener('message', (event) => {
    if (event.origin !== PARENT_ORIGIN || event.data?.type !== 'sheet-machine:request') return;
    const { id, action, payload } = event.data;
    google.script.run.withSuccessHandler((result) => send({ type:'sheet-machine:response', id, ok:true, result }))
      .withFailureHandler((failure) => send({ type:'sheet-machine:response', id, ok:false, error: failure.message || 'Backend request failed.' }))
      .dispatch(action, payload || {});
  });
  send({ type: 'sheet-machine:ready' });
</script></body></html>
